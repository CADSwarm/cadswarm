# Tests on every OS CadSwarm supports: the Python package, the host and the web app.
name: test

on:
  push:
    branches: [main, "release/**", "fix/**", "feat/**"]
  pull_request:

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -e ".[test,structural]"
      - run: python -m pytest -q -rs

  host:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5  # the worker tests drive a fake worker script
        with: { python-version: "3.12" }
      - run: cargo test --manifest-path host/Cargo.toml
        env:
          PYTHON: python

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit -p .
      - run: npm test

  install-sh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - run: sh -n install/install.sh && sh -n "Install CadSwarm.command"
      # With no FreeCAD on the runner the installer must stop with its friendly message.
      - run: |
          set +e
          out=$(CADSWARM_YES=1 HOME="$RUNNER_TEMP" sh install/install.sh --no-launch </dev/null)
          code=$?
          echo "$out"
          [ "$code" -eq 1 ] && echo "$out" | grep -q "FreeCAD isn't installed"
