[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadswarm"
version = "0.1.0"
description = "Multi-agent collaborative CAD on one live FreeCAD model (Claude Code + Codex)"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
structural = ["numpy>=1.26", "scipy>=1.11"]

[project.scripts]
cadswarm = "cadswarm.cli:main"

[tool.setuptools.packages.find]
include = ["cadswarm*"]

[tool.setuptools.package-data]
cadswarm = ["worker/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
