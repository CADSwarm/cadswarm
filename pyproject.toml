[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadswarm"
version = "0.1.0"
description = "Multi-agent collaborative CAD on one live FreeCAD model (Claude Code + Codex)"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
structural = ["numpy>=1.26", "scipy>=1.11"]
# The Droid reviewer. Not droid-sdk[mcp]: that extra pins mcp<2, which conflicts with mcp>=2.3.
reviewer = ["droid-sdk>=0.5"]

[project.scripts]
cadswarm = "cadswarm.cli:main"

[tool.setuptools.packages.find]
include = ["cadswarm*"]

[tool.setuptools.package-data]
cadswarm = ["worker/*.py", "settings_spec.json", "library/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
