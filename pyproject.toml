[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cadswarm"
version = "0.1.0"
description = "Independent parametric CAD platform with MCP tools for AI collaboration"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3"]

[project.optional-dependencies]
test = ["pytest>=8"]
structural = ["numpy>=1.26", "scipy>=1.11"]
desktop = ["PySide6>=6.8", "build123d>=0.12", "scipy>=1.11"]

[project.scripts]
cadswarm = "cadswarm.cli:main"
cadswarm-app = "cadswarm.app.__main__:main"
cadswarm-standalone-mcp = "cadswarm.app.standalone_mcp:main"

[tool.setuptools.packages.find]
include = ["cadswarm*"]

[tool.setuptools.package-data]
cadswarm = ["worker/*.py", "settings_spec.json", "library/*.json", "lattice/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
